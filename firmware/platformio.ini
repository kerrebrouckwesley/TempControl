; Waveshare ESP32-S3-Touch-LCD-1.46 (SPD2010, 412x412 rond, 16MB flash, 8MB OPI PSRAM)
; Ontvangt CPU/GPU-temperaturen via de USB-C poort (native USB CDC).

[env:waveshare_s3_touch_lcd_146]
; pioarduino = Arduino-ESP32 3.x (nodig voor de QSPI-driver van Arduino_GFX)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial loopt over de USB-C poort
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    olikraus/U8g2@2.36.18

monitor_speed = 115200
